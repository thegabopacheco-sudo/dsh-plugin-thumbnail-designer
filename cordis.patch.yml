# dsh-plugin-thumbnail-designer — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "thumbs".
# Tools resultantes: mcp__thumbs__* (ver README).
- insert:
    - id: mcp-thumbnail-designer
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: thumbs
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/thumbnail-designer/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
